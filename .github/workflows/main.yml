name: Generate playlist manually

# 生成结果只能通过 Pages Artifact 或 Release 发布，不得提交回 Git。
# 本工作流不依赖 iptv-api 的测速环节（GitHub Actions 美国网络会误杀国内源），
# 改为直接拉取饭太硬(fanmingming)国内优化源（jsDelivr CDN 镜像），合并后原样发布。

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: playlist-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      pages_base_url: ${{ steps.generate.outputs.pages_base_url }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Record revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch and merge playlists
        id: generate
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -e
          pages_base_url="${PAGES_BASE_URL%/}"
          echo "pages_base_url=$pages_base_url" >> "$GITHUB_OUTPUT"
          mkdir -p pages-site release-assets
          curl -fsSL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o index.m3u "https://cdn.jsdelivr.net/gh/fanmingming/live@main/tv/m3u/index.m3u"
          curl -fsSL --retry 4 --retry-delay 3 -A "Mozilla/5.0" -o ipv6.m3u "https://cdn.jsdelivr.net/gh/fanmingming/live@main/tv/m3u/ipv6.m3u"
          python3 scripts/merge_playlists.py
          cp result.m3u result.txt pages-site/
          cp result.m3u result.txt release-assets/
          echo "m3u_bytes=$(wc -c < result.m3u) txt_lines=$(wc -l < result.txt)"

      - name: Create release metadata
        id: release
        run: |
          tag="playlist-$(date -u +%Y%m%d-%H%M%S)-utc"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=Generated playlist $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (Asia/Shanghai)" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-release-assets-${{ steps.release.outputs.tag }}
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    needs: [generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: playlist-release-assets-${{ needs.generate.outputs.release_tag }}
          path: release-assets

      - name: Publish playlist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BASE: ${{ needs.generate.outputs.pages_base_url }}
          RELEASE_TAG: ${{ needs.generate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.generate.outputs.release_title }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
        run: |
          release_title="$RELEASE_TITLE"
          pages_link="<a href=\"$PAGES_BASE\" target=\"_blank\" rel=\"noopener noreferrer\">打开 GitHub Pages 结果页面 / Open GitHub Pages results page</a>"
          printf -v release_notes '%s\n\n%s\n\n%s' \
            "手动生成的 IPTV 结果（透传饭太硬源，未测速）。GitHub Pages 页面提供在线订阅地址与预览。" \
            "Manually generated IPTV results (pass-through of fanmingming sources, no speed test). The GitHub Pages page provides subscription URLs and previews." \
            "$pages_link"
          mapfile -d '' local_assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${local_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            --prerelease || echo "::warning::release publishing failed (non-blocking)"