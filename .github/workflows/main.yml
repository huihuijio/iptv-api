name: Generate playlist manually

# 生成结果只能通过 Pages Artifact 或 Release 发布，不得提交回 Git。
# 本工作流不再自行拉源/测速（GitHub Actions 美国网络会误杀国内源），
# 改为发布仓库 docs/ 下的精选直播源（由云电脑国内网络筛选后推送）。

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: playlist-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      pages_base_url: ${{ steps.generate.outputs.pages_base_url }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Record revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish curated playlist
        id: generate
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -e
          pages_base_url="${PAGES_BASE_URL%/}"
          echo "pages_base_url=$pages_base_url" >> "$GITHUB_OUTPUT"
          mkdir -p pages-site release-assets
          for f in docs/result.m3u docs/result.txt docs/result_ipv6.m3u docs/result_txiptv.m3u; do
            cp "$f" pages-site/
            cp "$f" release-assets/
          done
          echo "files=$(ls docs/ | tr '\n' ' ')"

      - name: Create release metadata
        id: release
        run: |
          tag="playlist-$(date -u +%Y%m%d-%H%M%S)-utc"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=Generated playlist $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (Asia/Shanghai)" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-release-assets-${{ steps.release.outputs.tag }}
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    needs: [generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: playlist-release-assets-${{ needs.generate.outputs.release_tag }}
          path: release-assets

      - name: Publish playlist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BASE: ${{ needs.generate.outputs.pages_base_url }}
          RELEASE_TAG: ${{ needs.generate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.generate.outputs.release_title }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
        run: |
          release_title="$RELEASE_TITLE"
          pages_link="<a href=\"$PAGES_BASE\" target=\"_blank\" rel=\"noopener noreferrer\">打开 GitHub Pages 结果页面 / Open GitHub Pages results page</a>"
          printf -v release_notes '%s\n\n%s\n\n%s' \
            "精选 IPTV 直播源（云电脑国内网络筛选，实测可用）。GitHub Pages 页面提供在线订阅地址与预览。" \
            "Curated IPTV sources (filtered from a domestic network, verified usable). The GitHub Pages page provides subscription URLs and previews." \
            "$pages_link"
          mapfile -d '' local_assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${local_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            --prerelease || echo "::warning::release publishing failed (non-blocking)"